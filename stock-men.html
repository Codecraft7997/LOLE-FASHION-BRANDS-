<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>LOLE | ستوك رجالي</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#f5e6bd;
 font-family:Tahoma,Arial,sans-serif;
}

header{
 background:#111;
 border-bottom:1px solid #b89545;
 padding:22px 12px;
 text-align:center;
}

header h1{
 margin:0;
 color:#d6b45e;
 letter-spacing:2px;
 font-size:25px;
}

header p{
 color:#ddd;
 margin:10px 0 0;
}

.back{
 display:inline-block;
 margin:18px;
 padding:10px 20px;
 color:#e8d18c;
 border:1px solid #b89545;
 border-radius:8px;
 text-decoration:none;
}

.container{
 padding:10px 15px 35px;
}

.heading{
 text-align:center;
 color:#d6b45e;
 font-size:23px;
 margin:15px 0 25px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:13px;
 max-width:1100px;
 margin:auto;
}

.product{
 background:#151515;
 border:1px solid #6e572b;
 border-radius:12px;
 overflow:hidden;
 cursor:pointer;
 transition:.2s;
}

.product:active{
 transform:scale(.97);
}

.product img{
 width:100%;
 height:190px;
 object-fit:cover;
 display:block;
 background:#222;
}

.info{
 padding:12px;
 text-align:center;
}

.code{
 font-size:14px;
 color:#e3c777;
}

.price{
 font-size:16px;
 color:white;
 margin-top:8px;
}

.placeholder{
 height:190px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#c6a85c;
 font-size:25px;
 background:linear-gradient(145deg,#222,#090909);
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#000e;
 z-index:10;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal-box{
 background:#151515;
 border:1px solid #c3a451;
 border-radius:15px;
 padding:17px;
 width:100%;
 max-width:390px;
 text-align:center;
 max-height:90vh;
 overflow-y:auto;
}

.modal-box img{
 width:100%;
 max-height:350px;
 object-fit:contain;
 border-radius:10px;
}

.modal-box h2{
 color:#d6b45e;
}

.modal-box p{
 color:white;
}

.buy,.close{
 display:block;
 width:100%;
 padding:13px;
 border-radius:8px;
 margin-top:12px;
 text-decoration:none;
 border:0;
 font-size:16px;
 cursor:pointer;
}

.buy{
 background:#c6a451;
 color:#111;
 font-weight:bold;
}

.close{
 background:#333;
 color:white;
}

footer{
 text-align:center;
 padding:20px;
 color:#a88d4d;
 font-size:13px;
}

@media(max-width:380px){
 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }

 .product img,.placeholder{
  height:165px;
 }
}
</style>
</head>

<body>

<header>
 <h1>LOLE FASHION BRANDS</h1>
 <p>MEN STOCK</p>
</header>

<a class="back" href="stock.html">← رجوع للستوك</a>

<div class="container">
 <h2 class="heading">تشكيلة الرجالي</h2>
 <div class="grid" id="products"></div>
</div>

<div class="modal" id="modal">
 <div class="modal-box">
  <img id="modalImage" src="" alt="صورة المنتج">
  <h2>تفاصيل المنتج</h2>
  <p id="modalCode"></p>
  <p id="modalPrice"></p>

  <a class="buy" id="buyButton" href="#">
   اذهب للشراء
  </a>

  <button class="close" onclick="closeProduct()">
   إغلاق
  </button>
 </div>
</div>

<footer>
 LOLE FASHION BRANDS © 2026
</footer>

<script>

// =================================
// المنتجات
// عدل الكود والسعر واسم الصورة من هنا
// =================================

const products = [

{code:"a",price:300,image:"a.jpg"},
{code:"b",price:150,image:"b.jpg"},
{code:"c",price:250,image:"c.jpg"},
{code:"d",price:300,image:"d.jpg"},
{code:"e",price:250,image:"e.jpg"},
{code:"f",price:300,image:"f.jpg"},
{code:"g",price:150,image:"g.jpg"},
{code:"h",price:300,image:"h.jpg"},
{code:"i",price:400,image:"i.jpg"},
{code:"j",price:300,image:"j.jpg"},
{code:"k",price:300,image:"k.jpg"},
{code:"l",price:350,image:"l.jpg"},
{code:"m",price:350,image:"m.jpg"},
{code:"n",price:350,image:"n.jpg"},
{code:"o",price:300,image:"o.jpg"},
{code:"p",price:300,image:"p.jpg"},
{code:"q",price:300,image:"q.jpg"},
{code:"r",price:350,image:"r.jpg"},
{code:"s",price:250,image:"s.jpg"},
{code:"t",price:350,image:"t.jpg"},
{code:"u",price:400,image:"u.jpg"},
{code:"v",price:0,image:"v.jpg"},
{code:"w",price:0,image:"w.jpg"},
{code:"x",price:0,image:"x.jpg"},
{code:"y",price:0,image:"y.jpg"},
{code:"z",price:0,image:"z.jpg"},
{code:"aa",price:0,image:"aa.jpg"},
{code:"bb",price:0,image:"bb.jpg"},
{code:"cc",price:0,image:"cc.jpg"},
{code:"dd",price:0,image:"dd.jpg"},
{code:"ee",price:0,image:"ee.jpg"},
{code:"ff",price:0,image:"ff.jpg"},
{code:"gg",price:0,image:"gg.jpg"},
{code:"hh",price:0,image:"hh.jpg"},
{code:"ii",price:0,image:"ii.jpg"},
{code:"jj",price:0,image:"jj.jpg"},
{code:"kk",price:0,image:"kk.jpg"},
{code:"ll",price:0,image:"ll.jpg"},
{code:"mm",price:0,image:"mm.jpg"},
{code:"nn",price:0,image:"nn.jpg"},
{code:"oo",price:0,image:"oo.jpg"},
{code:"pp",price:0,image:"pp.jpg"},
{code:"qq",price:0,image:"qq.jpg"},
{code:"rr",price:0,image:"rr.jpg"},
{code:"ss",price:0,image:"ss.jpg"},
{code:"tt",price:0,image:"tt.jpg"},
{code:"uu",price:0,image:"uu.jpg"},
{code:"vv",price:0,image:"vv.jpg"},
{code:"ww",price:0,image:"ww.jpg"},
{code:"xx",price:0,image:"xx.jpg"},
{code:"yy",price:0,image:"yy.jpg"}

];

// =================================
// عرض المنتجات
// =================================

const container=document.getElementById("products");

products.forEach((product,index)=>{

 const card=document.createElement("div");
 card.className="product";

 const placeholder=document.createElement("div");
 placeholder.className="placeholder";
 placeholder.textContent="فارغ";

 const img=document.createElement("img");
 img.src=product.image;
 img.alt="رجالي";

 img.onerror=()=>{
  img.replaceWith(placeholder);
 };

 const info=document.createElement("div");
 info.className="info";

 info.innerHTML=`
  <div class="code">${product.code}</div>
  <div class="price">${product.price} جنيه</div>
 `;

 card.appendChild(img);
 card.appendChild(info);

 card.addEventListener("click",()=>{
  openProduct(index);
 });

 container.appendChild(card);

});

// =================================
// تفاصيل المنتج والشراء
// =================================

function openProduct(index){

 const product=products[index];

 document.getElementById("modalImage").src=
 product.image;

 document.getElementById("modalCode").textContent=
 "كود المنتج: "+product.code;

 document.getElementById("modalPrice").textContent=
 "السعر: "+product.price+" جنيه";

 const imageURL=new URL(product.image,location.href).href;

 document.getElementById("buyButton").href=
 "terms.html?code="+encodeURIComponent(product.code)+
 "&price="+encodeURIComponent(product.price)+
 "&image="+encodeURIComponent(imageURL);

 document.getElementById("modal").style.display="flex";
}

// =================================
// إغلاق التفاصيل
// =================================

function closeProduct(){
 document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
 if(e.target===this){
  closeProduct();
 }
});

</script>

</body>
</html>
