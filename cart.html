
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>سلة المشتريات | LOLE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:#f5e6bd;
 font-family:Tahoma,Arial,sans-serif;
}

header{
 text-align:center;
 padding:22px;
 background:#111;
 border-bottom:1px solid #b89545;
}

header h2{
 color:#d6b45e;
 margin:0;
 font-size:23px;
}

header p{
 color:#aaa;
 margin:9px 0 0;
}

.container{
 max-width:650px;
 width:94%;
 margin:25px auto;
}

.card{
 background:#151515;
 border:1px solid #80652f;
 border-radius:13px;
 padding:15px;
 margin-bottom:13px;
}

.item{
 display:flex;
 gap:13px;
 align-items:center;
}

.item img{
 width:100px;
 height:110px;
 object-fit:cover;
 border-radius:8px;
 background:#222;
}

.details{
 flex:1;
 min-width:0;
}

.details strong{
 color:#d6b45e;
}

.details p{
 font-size:13px;
 color:#aaa;
 margin:8px 0;
}

.quantity{
 color:#d6b45e!important;
 font-weight:bold;
}

.remove{
 background:#492020;
 color:white;
 border:0;
 border-radius:6px;
 padding:9px 13px;
 margin-top:8px;
 cursor:pointer;
 font-family:inherit;
}

.total{
 display:flex;
 justify-content:space-between;
 font-size:19px;
 color:#d6b45e;
 padding:15px 0;
}

.checkout{
 width:100%;
 padding:15px;
 background:#c6a451;
 color:#111;
 border:0;
 border-radius:8px;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
 font-family:inherit;
}

.continue{
 width:100%;
 padding:13px;
 background:#29251d;
 color:#e5c47d;
 border:1px solid #80652f;
 border-radius:8px;
 margin-top:10px;
 cursor:pointer;
 font-family:inherit;
}

.empty{
 text-align:center;
 padding:40px 15px;
 color:#aaa;
 line-height:2;
}

.count{
 color:#d6b45e;
 font-size:13px;
 margin-bottom:15px;
}

@media(max-width:380px){
 .item img{
  width:80px;
  height:95px;
 }
 .details p{font-size:12px}
}
</style>
</head>

<body>

<header>
 <h2>LOLE FASHION BRANDS</h2>
 <p>سلة المشتريات</p>
</header>

<div class="container">

 <p class="count" id="count"></p>

 <div id="items"></div>

 <div class="card">

  <div class="total">
   <strong>إجمالي المنتجات</strong>
   <strong id="total">0 جنيه</strong>
  </div>

  <p style="font-size:12px;color:#aaa;line-height:1.8;margin-bottom:15px">
   كل منتج متاح منه قطعة واحدة فقط.
   يتم حساب التوصيل والعربون في صفحة إتمام الطلب.
  </p>

  <button class="checkout" onclick="checkout()">
   إتمام الطلب ←
  </button>

  <button class="continue" onclick="goShopping()">
   متابعة التسوق
  </button>

 </div>

</div>

<script>

const CART_KEY="lole_cart";

// قراءة السلة
function getCart(){

 try{
  const cart=JSON.parse(localStorage.getItem(CART_KEY))||[];

  // ضمان قطعة واحدة لكل منتج
  const unique=[];

  cart.forEach(item=>{
   if(!unique.some(x=>x.id===item.id)){
    item.qty=1;
    unique.push(item);
   }
  });

  localStorage.setItem(CART_KEY,JSON.stringify(unique));

  return unique;

 }catch(e){
  return [];
 }

}

// حفظ السلة
function saveCart(cart){

 localStorage.setItem(CART_KEY,JSON.stringify(cart));

 render();

}

// عرض المنتجات
function render(){

 const cart=getCart();

 const box=document.getElementById("items");

 box.innerHTML="";

 let total=0;

 document.getElementById("count").textContent=
 "عدد المنتجات: "+cart.length;

 if(cart.length===0){

  box.innerHTML=`
  <div class="card empty">
   <div style="font-size:35px">🛒</div>
   السلة فارغة حالياً
   <br>
   اختار منتجاتك من LOLE
  </div>`;

  document.getElementById("total").textContent="0 جنيه";

  return;

 }

 cart.forEach((item,index)=>{

  const price=Number(item.price)||0;

  total+=price;

  const card=document.createElement("div");

  card.className="card";

  const image=document.createElement("img");
  image.src=item.image||"";
  image.alt="صورة المنتج";

  image.onerror=function(){
   this.style.display="none";
  };

  const details=document.createElement("div");
  details.className="details";

  const code=document.createElement("strong");
  code.textContent="كود المنتج: "+item.code;

  const category=document.createElement("p");
  category.textContent=item.category||"منتج LOLE";

  const priceText=document.createElement("p");
  priceText.textContent="سعر القطعة: "+price+" جنيه";

  const quantity=document.createElement("p");
  quantity.className="quantity";
  quantity.textContent="الكمية: قطعة واحدة";

  const remove=document.createElement("button");
  remove.className="remove";
  remove.textContent="حذف المنتج";

  remove.onclick=function(){
   removeItem(index);
  };

  details.append(code,category,priceText,quantity,remove);

  const itemBox=document.createElement("div");
  itemBox.className="item";

  itemBox.append(image,details);

  card.appendChild(itemBox);

  box.appendChild(card);

 });

 document.getElementById("total").textContent=
 total+" جنيه";

}

// حذف منتج
function removeItem(index){

 let cart=getCart();

 cart.splice(index,1);

 saveCart(cart);

}

// إتمام الطلب
function checkout(){

 const cart=getCart();

 if(cart.length===0){
  alert("السلة فارغة! أضف منتجات أولاً.");
  return;
 }

 location.href="terms.html";

}

// متابعة التسوق
function goShopping(){

 history.back();

}

// تشغيل
render();

</script>

</body>
</html>
