
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOLE | قسم الستوك</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#090909;
 color:#f5e6bd;
 font-family:Tahoma,Arial,sans-serif;
}

header{
 background:#111;
 border-bottom:1px solid #b89545;
 padding:25px 12px;
 text-align:center;
}

header h1{
 margin:0;
 color:#d6b45e;
 font-size:26px;
 letter-spacing:2px;
}

header p{color:#ddd;margin:10px 0 0}

.back{
 display:inline-block;
 margin:18px;
 padding:10px 20px;
 color:#e8d18c;
 border:1px solid #b89545;
 border-radius:8px;
 text-decoration:none;
}

.container{
 max-width:900px;
 margin:auto;
 padding:20px 16px 40px;
}

.heading{
 text-align:center;
 color:#d6b45e;
 font-size:25px;
 margin:15px 0 30px;
}

.categories{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:18px;
}

.category{
 background:linear-gradient(145deg,#202020,#0d0d0d);
 border:1px solid #b89545;
 border-radius:15px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
 text-decoration:none;
 color:#f5e6bd;
 transition:.2s;
}

.category:active{transform:scale(.97)}

.category img{
 width:100%;
 height:260px;
 object-fit:cover;
 display:block;
}

.category-content{
 padding:20px;
 text-align:center;
}

.category h2{
 color:#d6b45e;
 font-size:23px;
 margin:0 0 12px;
}

.category p{
 color:#ccc;
 font-size:14px;
 line-height:1.8;
 margin:0;
}

.enter{
 display:inline-block;
 margin-top:20px;
 background:#c6a451;
 color:#111;
 padding:10px 25px;
 border-radius:7px;
 font-weight:bold;
}

footer{
 text-align:center;
 padding:20px;
 color:#a88d4d;
 font-size:13px;
}

@media(max-width:500px){
 .categories{grid-template-columns:1fr}
 .category img{height:240px}
}
</style>
</head>

<body>

<header>
 <h1>LOLE FASHION BRANDS</h1>
 <p>STOCK COLLECTION</p>
</header>

<a class="back" href="index.html">← الصفحة الرئيسية</a>

<div class="container">
 <h2 class="heading">قسم الستوك</h2>

 <div class="categories">

  <a class="category" href="stock-men.html">
   <img
    src="mmm.jpg"
    alt="ملابس رجالي"
   >
   <div class="category-content">
    <h2>ستوك رجالي</h2>
    <p>تشكيلة الملابس الرجالي المتاحة في قسم الستوك</p>
    <span class="enter">استكشف المنتجات</span>
   </div>
  </a>

  <a class="category" href="stock-women.html">
   <img
    src="uni.jpg"
    alt="ملابس حريمي"
   >
   <div class="category-content">
    <h2>unisex</h2>
    <p>تشكيلة الunisex المتاحة في قسم الستوك</p>
    <span class="enter">استكشف المنتجات</span>
   </div>
  </a>

 </div>
</div>

<footer>LOLE FASHION BRANDS © 2026</footer>

</body>
</html>
