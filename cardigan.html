
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>LOLE | كارديجان حريمي</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#090909;
color:#f5e6bd;
font-family:Tahoma,Arial,sans-serif
}

header{
background:#111;
border-bottom:1px solid #b89545;
padding:22px 12px;
text-align:center
}

header h1{
margin:0;
color:#d6b45e;
letter-spacing:2px;
font-size:25px
}

header p{
color:#ddd;
margin:10px 0 0
}

.header-actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:0 15px
}

.back,.cart-link{
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
margin:18px 0;
padding:10px 14px;
color:#e8d18c;
border:1px solid #b89545;
border-radius:8px;
text-decoration:none;
font-size:13px
}

.cart-count{
background:#c6a451;
color:#111;
min-width:21px;
height:21px;
border-radius:50%;
display:inline-flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:bold
}

.container{
padding:10px 15px 35px
}

.heading{
text-align:center;
color:#d6b45e;
font-size:23px;
margin:15px 0 25px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
gap:13px;
max-width:1100px;
margin:auto
}

.product{
background:#151515;
border:1px solid #6e572b;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s
}

.product:active{
transform:scale(.97)
}

.product img{
width:100%;
height:190px;
object-fit:cover;
display:block;
background:#222
}

.info{
padding:12px;
text-align:center
}

.code{
font-size:14px;
color:#e3c777
}

.price{
font-size:16px;
color:white;
margin-top:8px
}

.placeholder{
height:190px;
display:flex;
align-items:center;
justify-content:center;
color:#c6a85c;
font-size:25px;
background:linear-gradient(145deg,#222,#090909)
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000e;
z-index:10;
align-items:center;
justify-content:center;
padding:15px
}

.modal-box{
background:#151515;
border:1px solid #c3a451;
border-radius:15px;
padding:17px;
width:100%;
max-width:390px;
text-align:center;
max-height:90vh;
overflow-y:auto
}

.modal-box img{
width:100%;
max-height:350px;
object-fit:contain;
border-radius:10px
}

.modal-box h2{
color:#d6b45e
}

.modal-box p{
color:white
}

.add,.close{
display:block;
width:100%;
padding:13px;
border-radius:8px;
margin-top:12px;
border:0;
font-size:16px;
cursor:pointer
}

.add{
background:#c6a451;
color:#111;
font-weight:bold
}

.close{
background:#333;
color:white
}

footer{
text-align:center;
padding:20px;
color:#a88d4d;
font-size:13px
}

@media(max-width:380px){

.grid{
grid-template-columns:repeat(2,minmax(0,1fr))
}

.product img,.placeholder{
height:165px
}

header h1{
font-size:21px
}

.back,.cart-link{
font-size:12px;
padding:9px 11px
}

}
</style>
</head>

<body>

<header>
<h1>LOLE FASHION BRANDS</h1>
<p>Cardigan Collection</p>
</header>

<div class="header-actions">

<a class="back" href="new-women.html">
← رجوع للأقسام
</a>

<a class="cart-link" href="cart.html">
🛒 السلة
<span class="cart-count" id="cartCount">0</span>
</a>

</div>

<div class="container">
<h2 class="heading">تشكيلة الكارديجان الحريمي</h2>
<div class="grid" id="products"></div>
</div>

<div class="modal" id="modal">

<div class="modal-box">

<img id="modalImage" src="" alt="صورة المنتج">

<h2>تفاصيل المنتج</h2>

<p id="modalCode"></p>
<p id="modalPrice"></p>

<button class="add" id="addButton" onclick="addToCart()">
+ إضافة إلى السلة
</button>

<button class="close" onclick="closeProduct()">
إغلاق
</button>

</div>

</div>

<footer>
LOLE FASHION BRANDS © 2026
</footer>

<script>

// =====================================
// إعدادات السلة
// =====================================

const CART_KEY="lole_cart";

function getCart(){
try{
return JSON.parse(localStorage.getItem(CART_KEY)) || [];
}catch(e){
return [];
}
}

function updateCartCount(){
const cart=getCart();
document.getElementById("cartCount").textContent=cart.length;
}

// =====================================
// المنتجات
// =====================================

const products=[
{code:"1a",price:400,image:"1a.jpg"},
{code:"1b",price:450,image:"1b.jpg"},
{code:"1c",price:600,image:"1c.jpg"},
{code:"1d",price:650,image:"1d.jpg"},
{code:"1e",price:700,image:"1e.jpg"},
{code:"1f",price:0,image:"1f.jpg"},
{code:"1g",price:0,image:"1g.jpg"},
{code:"1h",price:0,image:"1h.jpg"},
{code:"1i",price:0,image:"1i.jpg"},
{code:"1j",price:0,image:"1j.jpg"},
{code:"1k",price:0,image:"1k.jpg"},
{code:"1l",price:0,image:"1l.jpg"},
{code:"1m",price:0,image:"1m.jpg"},
{code:"1n",price:0,image:"1n.jpg"},
{code:"1o",price:0,image:"1o.jpg"},
{code:"1p",price:0,image:"1p.jpg"},
{code:"1q",price:0,image:"1q.jpg"},
{code:"1r",price:0,image:"1r.jpg"},
{code:"1s",price:0,image:"1s.jpg"},
{code:"1t",price:0,image:"1t.jpg"},
{code:"1u",price:0,image:"1u.jpg"},
{code:"1v",price:0,image:"1v.jpg"},
{code:"1w",price:0,image:"1w.jpg"},
{code:"1x",price:0,image:"1x.jpg"},
{code:"1y",price:0,image:"1y.jpg"},
{code:"1z",price:0,image:"1z.jpg"},
{code:"2a",price:0,image:"2a.jpg"},
{code:"2b",price:0,image:"2b.jpg"},
{code:"2c",price:0,image:"2c.jpg"},
{code:"2d",price:0,image:"2d.jpg"},
{code:"2e",price:0,image:"2e.jpg"},
{code:"2f",price:0,image:"2f.jpg"},
{code:"2g",price:0,image:"2g.jpg"},
{code:"2h",price:0,image:"2h.jpg"},
{code:"2i",price:0,image:"2i.jpg"},
{code:"2j",price:0,image:"2j.jpg"},
{code:"2k",price:0,image:"2k.jpg"},
{code:"2l",price:0,image:"2l.jpg"},
{code:"2m",price:0,image:"2m.jpg"},
{code:"2n",price:0,image:"2n.jpg"},
{code:"2o",price:0,image:"2o.jpg"},
{code:"2p",price:0,image:"2p.jpg"},
{code:"2q",price:0,image:"2q.jpg"},
{code:"2r",price:0,image:"2r.jpg"},
{code:"2s",price:0,image:"2s.jpg"},
{code:"2t",price:0,image:"2t.jpg"},
{code:"2u",price:0,image:"2u.jpg"},
{code:"2v",price:0,image:"2v.jpg"},
{code:"2w",price:0,image:"2w.jpg"},
{code:"2x",price:0,image:"2x.jpg"}
];

// =====================================
// عرض المنتجات
// =====================================

const container=document.getElementById("products");

products.forEach((product,index)=>{

const card=document.createElement("div");
card.className="product";

const placeholder=document.createElement("div");
placeholder.className="placeholder";
placeholder.textContent="فارغ";

const img=document.createElement("img");
img.src=product.image;
img.alt="كارديجان حريمي";
img.onerror=()=>img.replaceWith(placeholder);

const info=document.createElement("div");
info.className="info";

info.innerHTML=`
<div class="code">${product.code}</div>
<div class="price">${toArabicNumbers(product.price)} جنيه</div>
`;

card.appendChild(img);
card.appendChild(info);

card.addEventListener("click",()=>openProduct(index));

container.appendChild(card);

});

// =====================================
// تحويل الأرقام إلى عربية
// =====================================

function toArabicNumbers(number){
return String(number).replace(/\d/g,digit=>"٠١٢٣٤٥٦٧٨٩"[digit]);
}

// =====================================
// تفاصيل المنتج
// =====================================

let selectedProduct=null;

function openProduct(index){

selectedProduct=products[index];

document.getElementById("modalImage").src=selectedProduct.image;

document.getElementById("modalCode").textContent=
"كود المنتج: "+selectedProduct.code;

document.getElementById("modalPrice").textContent=
"السعر: "+toArabicNumbers(selectedProduct.price)+" جنيه";

document.getElementById("modal").style.display="flex";

}

// =====================================
// إضافة المنتج للسلة - نفس نظام البلوفر
// =====================================

function addToCart(){

if(!selectedProduct)return;

let cart=getCart();

const id=location.pathname+"_"+selectedProduct.code;

const exists=cart.some(item=>item.id===id);

if(exists){
alert("المنتج مضاف بالفعل إلى السلة");
return;
}

cart.push({
id:id,
code:selectedProduct.code,
price:selectedProduct.price,
image:new URL(selectedProduct.image,location.href).href,
category:document.querySelector(".heading").textContent.trim(),
qty:1
});

localStorage.setItem(CART_KEY,JSON.stringify(cart));

updateCartCount();

alert("تمت إضافة المنتج إلى السلة");

closeProduct();

}

// =====================================
// إغلاق النافذة
// =====================================

function closeProduct(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this)closeProduct();
});

// تحديث عداد السلة
updateCartCount();
window.addEventListener("pageshow",updateCartCount);

</script>

</body>
</html>
