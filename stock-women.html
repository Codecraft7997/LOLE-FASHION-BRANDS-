
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>LOLE | unisex</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5e6bd;font-family:Tahoma,Arial,sans-serif}
header{background:#111;border-bottom:1px solid #b89545;padding:22px 12px;text-align:center}
header h1{margin:0;color:#d6b45e;letter-spacing:2px;font-size:25px}
header p{color:#ddd;margin:10px 0 0}
.back{display:inline-block;margin:18px;padding:10px 20px;color:#e8d18c;border:1px solid #b89545;border-radius:8px;text-decoration:none}
.container{padding:10px 15px 35px}
.heading{text-align:center;color:#d6b45e;font-size:23px;margin:15px 0 25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px;max-width:1100px;margin:auto}
.product{background:#151515;border:1px solid #6e572b;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.product:active{transform:scale(.97)}
.product img{width:100%;height:190px;object-fit:cover;display:block;background:#222}
.info{padding:12px;text-align:center}
.code{font-size:14px;color:#e3c777}
.price{font-size:16px;color:white;margin-top:8px}
.placeholder{height:190px;display:flex;align-items:center;justify-content:center;color:#c6a85c;font-size:25px;background:linear-gradient(145deg,#222,#090909)}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#151515;border:1px solid #c3a451;border-radius:15px;padding:17px;width:100%;max-width:390px;text-align:center;max-height:90vh;overflow-y:auto}
.modal-box img{width:100%;max-height:350px;object-fit:contain;border-radius:10px}
.modal-box h2{color:#d6b45e}
.modal-box p{color:white}
.buy,.close{display:block;width:100%;padding:13px;border-radius:8px;margin-top:12px;text-decoration:none;border:0;font-size:16px;cursor:pointer}
.buy{background:#c6a451;color:#111;font-weight:bold}
.close{background:#333;color:white}
footer{text-align:center;padding:20px;color:#a88d4d;font-size:13px}
@media(max-width:380px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.product img,.placeholder{height:165px}
}
</style>
</head>

<body>

<header>
<h1>LOLE FASHION BRANDS</h1>
<p>UNISEX STOCK</p>
</header>

<a class="back" href="stock.html">← رجوع للستوك</a>

<div class="container">
<h2 class="heading">تشكيلة الunisex</h2>
<div class="grid" id="products"></div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<img id="modalImage" src="" alt="صورة المنتج">
<h2>تفاصيل المنتج</h2>
<p id="modalCode"></p>
<p id="modalPrice"></p>
<a class="buy" id="buyButton" href="#">اذهب للشراء</a>
<button class="close" onclick="closeProduct()">إغلاق</button>
</div>
</div>

<footer>LOLE FASHION BRANDS © 2026</footer>

<script>
const products = [
{code:"1١",price:450,image:"1١.jpg"},
{code:"2٢",price:400,image:"2٢.jpg"},
{code:"3٣",price:450,image:"3٣.jpg"},
{code:"4٤",price:300,image:"4٤.jpg"},
{code:"5٥",price:450,image:"5٥.jpg"},
{code:"6٦",price:300,image:"6٦.jpg"},
{code:"7٧",price:450,image:"7٧.jpg"},
{code:"8٨",price:400,image:"8٨.jpg"},
{code:"9٩",price:300,image:"9٩.jpg"},
{code:"10١٠",price:450,image:"10١٠.jpg"},
{code:"11١١",price:400,image:"11١١.jpg"},
{code:"12١٢",price:400,image:"12١٢.jpg"},
{code:"13١٣",price:450,image:"13١٣.jpg"},
{code:"14١٤",price:300,image:"14١٤.jpg"},
{code:"15١٥",price:450,image:"15١٥.jpg"},
{code:"16١٦",price:400,image:"16١٦.jpg"},
{code:"17١٧",price:400,image:"17١٧.jpg"},
{code:"18١٨",price:450,image:"18١٨.jpg"},
{code:"19١٩",price:370,image:"19١٩.jpg"},
{code:"20٢٠",price:0,image:"20٢٠.jpg"},
{code:"21٢١",price:0,image:"21٢١.jpg"},
{code:"22٢٢",price:0,image:"22٢٢.jpg"},
{code:"23٢٣",price:0,image:"23٢٣.jpg"},
{code:"24٢٤",price:0,image:"24٢٤.jpg"},
{code:"25٢٥",price:0,image:"25٢٥.jpg"},
{code:"26٢٦",price:0,image:"26٢٦.jpg"},
{code:"27٢٧",price:0,image:"27٢٧.jpg"},
{code:"28٢٨",price:0,image:"28٢٨.jpg"},
{code:"29٢٩",price:0,image:"29٢٩.jpg"},
{code:"30٣٠",price:0,image:"30٣٠.jpg"},

{code:"49٤٩",price:0,image:"49٤٩.jpg"},
{code:"50٥٠",price:0,image:"50٥٠.jpg"}
];

const container=document.getElementById("products");

products.forEach((product,index)=>{
const card=document.createElement("div");
card.className="product";

const placeholder=document.createElement("div");
placeholder.className="placeholder";
placeholder.textContent="فارغ";

const img=document.createElement("img");
img.src=product.image;
img.alt="UNISEX";
img.onerror=()=>img.replaceWith(placeholder);

const info=document.createElement("div");
info.className="info";
info.innerHTML=`
<div class="code">${product.code}</div>
<div class="price">${product.price} جنيه</div>
`;

card.appendChild(img);
card.appendChild(info);
card.addEventListener("click",()=>openProduct(index));
container.appendChild(card);
});

function openProduct(index){
const product=products[index];

document.getElementById("modalImage").src=product.image;
document.getElementById("modalCode").textContent="كود المنتج: "+product.code;
document.getElementById("modalPrice").textContent="السعر: "+product.price+" جنيه";

const imageURL=new URL(product.image,location.href).href;

document.getElementById("buyButton").href=
"terms.html?code="+encodeURIComponent(product.code)+
"&price="+encodeURIComponent(product.price)+
"&image="+encodeURIComponent(imageURL);

document.getElementById("modal").style.display="flex";
}

function closeProduct(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this)closeProduct();
});
</script>

</body>
</html>
